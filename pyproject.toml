[project]
name = "lrr-queue"
version = "0.1.0"
description = "Download queue for LANraragi, fed by the ExHentai userscript."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "peewee>=3.17",
    "pydantic-settings>=2.4",
    "lanraragi-api",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "pytest>=8",
    "ruff>=0.6",
]

[project.scripts]
lrr-queue = "lrr_queue.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lrr_queue"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
